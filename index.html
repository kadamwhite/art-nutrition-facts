<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Art Nutrition Facts</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="input-form">
    <div class="header">
      <h1>Art Nutrition Facts</h1>
    </div>

    <div class="card">
      <div class="title-wrap">
        <label for="art-title">Artwork Title</label>
        <input type="text" id="art-title" placeholder="Untitled"
              autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>

    <div class="card" id="slider-rows"></div>

    <button type="button" class="ok-button" id="ok-button">OK</button>
  </div>

  <div id="rendered"></div>

  <footer>
    <p class="credits">Made with love by kadamwhite</p>
  </footer>

  <script src="./nutrition.js"></script>
</body>
</html>
