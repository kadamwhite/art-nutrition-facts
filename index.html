<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Art Nutrition Facts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, :root {
      font-size: 18px;
    }
    body {
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: white;
      min-height: 100svh;
      -webkit-text-size-adjust: 100%;
      color: black;
    }

    #input-form {
      padding: 28px 16px 64px;
      max-width: 480px;
      margin: 0 auto;
    }

    .header { text-align: center; margin-bottom: 1rem; }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .header p  { font-size: 14px; color: #8e8e93; margin-top: 4px; }

    .card {
      border-radius: 2px;
      border: 1px solid grey;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .title-wrap { padding: 10px 16px 14px; }
    .title-wrap label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: grey;
      margin-bottom: 0.25rem;
    }
    .title-wrap input[type="text"] {
      width: 100%;
      font-size: 1rem;
      border: none;
      background: transparent;
      outline: none;
      color: black;
    }
    .title-wrap input::placeholder { color: #c7c7cc; }

    .nutrient-row { padding: 12px 16px 8px; }
    .nutrient-row + .nutrient-row { border-top: 0.5px solid #e5e5ea; }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .row-top .nutrient-label { font-size: 16px; font-weight: 500; }
    .row-top .nutrient-value {
      font-size: 15px;
      font-weight: 600;
      color: #636366;
      min-width: 28px;
      text-align: right;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      accent-color: black;
    }

    button.ok-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: black;
      color: white;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    #label {
      display: none;
      padding: 2rem 0.75rem 80px;
      max-width: 420px;
      margin: 0 auto;
    }

    .nutrition-facts {
      border: 3px solid black;
      padding: 6px 8px;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .form-title {
      font-size: 44px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.5px;
    }

    .servings-per-container { font-size: 0.85rem; margin-top: 3px; }

    .serving-size {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 1px;
    }

    .bar-thick  { height: 9px; background: black; margin: 4px 0; }
    .bar-medium { height: 5px; background: black; margin: 2px 0; }
    .bar-thin   { height: 1px; background: black; }

    .per-serving { font-size: 13px; }

    .calories-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .calories-label { font-size: 28px; font-weight: 900; line-height: 1; }
    .calories-amt { font-size: 42px; font-weight: 900; line-height: 1; }

    .pct-dv {
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
      font-size: 0.85rem;
    }
    .row + .row { border-top: 1px solid black; }
    .nutrient-row-left { display: flex; align-items: baseline; gap: 4px; }
    .nutrient-label  { font-weight: 700; }
    .nutrient-amt  { font-weight: 400; }
    .nutrient-dv { font-weight: 700; }

    /* Vitamins 2-column grid */
    .small-row { display: flex; }
    .small-row + .small-row { border-top: 1px solid black; }
    .mineral-label { flex: 1; padding: 2px 0; font-size: 13px; }
    .mineral-label + .mineral-label { padding-left: 10px; }

    .footer {
      border-top: 1px solid black;
      margin-top: 4px;
      padding-top: 4px;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="input-form">
  <div class="header">
    <h1>Art Nutrition Facts</h1>
  </div>

  <div class="card">
    <div class="title-wrap">
      <label for="art-title">Artwork Title</label>
      <input type="text" id="art-title" placeholder="Untitled"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </div>

  <div class="card" id="slider-rows"></div>

  <button type="button" class="ok-button" id="ok-button">OK</button>
</div>

<div class="nutrition-facts" id="label"></div>

<script>
  const mainProperties = [
    { id: 'pretension', label: 'Pretension', unit: 'g',  dv: 50  },
    { id: 'sincerity',  label: 'Sincerity',  unit: 'g',  dv: 50  },
    { id: 'trauma',     label: 'Trauma',     unit: 'g',  dv: 25  },
    { id: 'melancholy', label: 'Melancholy', unit: 'g',  dv: 30  },
    { id: 'confusion',  label: 'Confusion',  unit: 'mg', dv: 200 },
  ];
  const minerals = [
    { id: 'activism',  label: 'Activism',     unit: 'g',  dv: 35  },
    { id: 'tension',   label: 'Studiousness', unit: 'mg', dv: 150 },
    { id: 'nostalgia', label: 'Nostalgia',    unit: 'mg', dv: 350 },
    { id: 'whimsy',    label: 'Whimsy',       unit: 'g',  dv: 25  },
  ];
  const allProperties = [...mainProperties, ...minerals];
  const vals = Object.fromEntries(allProperties.map(n => [n.id, 0]));

  // Build slider rows
  const rowsEl = document.getElementById('slider-rows');
  allProperties.forEach(n => {
    const row = document.createElement('div');
    row.className = 'nutrient-row';
    row.innerHTML = `
      <div class="row-top">
        <span class="nutrient-label">${n.label}</span>
        <span class="nutrient-value" id="v-${n.id}">0</span>
      </div>
      <input type="range" min="0" max="100" value="0" aria-label="${n.label}">`;
    rowsEl.appendChild(row);

    const input = row.querySelector('input');
    const valEl = document.getElementById('v-' + n.id);
    input.addEventListener('input', () => {
      vals[n.id] = +input.value;
      valEl.textContent = input.value;
    });
  });

  let timeout = null;
  document.addEventListener('click', ( evt ) => {
    const row = evt.target.closest( '.row' );
    if ( ! row ) {
      return;
    }
    if ( timeout && Date.now() < timeout ) {
      row.remove();
      return;
    }
    timeout = Date.now() + 500;
  } );

  document.getElementById('ok-button').addEventListener('click', () => {
    const title = document.getElementById('art-title').value.trim() || 'Untitled';
    const total = allProperties.reduce((s, n) => s + vals[n.id], 0);

    const round = n => Math.round(vals[n.id] / 100 * n.dv) + n.unit;
    const percent = n => vals[n.id] + '%';

    const mineralsRendered = [];
    for (let i = 0; i < minerals.length; i += 2) {
      const pair = minerals.slice(i, i + 2);
      mineralsRendered.push(`<div class="small-row">
        ${pair.map(n => `<div class="mineral-label"><span contenteditable>${n.label}</span> <strong contenteditable>${percent(n)}</strong></div>`).join('')}
      </div>`);
    }

    document.getElementById('label').innerHTML = `
      <div class="form-title">Art Facts</div>
      <div class="servings-per-container">${ '' /* Per artistic experience */ }</div>
      <div class="serving-size">
        <span>Serving size</span><span class="quantity" contenteditable>1 viewing</span>
      </div>
      <div class="bar-thick" /></div>
      <div class="per-serving" contenteditable>Amount per viewing</div>
      <div class="calories-row">
        <span class="calories-label" contenteditable>Intensity</span>
        <span class="calories-amt" contenteditable>${total}</span>
      </div>
      <div class="bar-thin"></div>
      <div class="pct-dv">% Daily Value*</div>
      <div class="bar-medium"></div>
      ${mainProperties.map(n => `
        <div class="row">
          <div class="nutrient-row-left">
            <span class="nutrient-label" contenteditable>${n.label}</span>
            <span class="nutrient-amt" contenteditable>${round(n)}</span>
          </div>
          <span class="nutrient-dv" contenteditable>${percent(n)}</span>
        </div>`).join('')}
      <div class="bar-thick"></div>
      ${mineralsRendered.join('')}
      <div class="footer">*The % Daily Value (DV) tells you how much of this attribute a single viewing contributes to a daily aesthetic experience. ${ ''/* 1,000 units is used for general art nutrition advice. */ }<br><em>${ title === 'Untitled' ? '' : title}</em></div>`;

    document.getElementById('input-form').style.display = 'none';
    document.getElementById('label').style.display = 'block';
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
